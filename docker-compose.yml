services:
  db:
    image: ankane/pgvector:v0.5.1 # Updated to a more stable and existing image
    container_name: skripsi_db_container
    restart: always
    environment:
      POSTGRES_DB: skripsi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432" # Changed from 5432 to 5433 to avoid conflict with existing 'bench_db'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Automatically run schema.sql on first startup
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
